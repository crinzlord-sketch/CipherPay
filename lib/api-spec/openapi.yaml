    SocialService:
      type: object
      required: [id, name, platform, category, pricePerUnit, minQuantity, maxQuantity, unit, description]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
        category:
          type: string
        pricePerUnit:
          type: number
        minQuantity:
          type: integer
        maxQuantity:
          type: integer
        unit:
          type: string
        description:
          type: string
        deliveryTime:
          type: ["string", "null"]
        quality:
          type: ["string", "null"]

    SocialOrderInput:
      type: object
      required: [serviceId, link, quantity]
      properties:
        serviceId:
          type: string
        link:
          type: string
        quantity:
          type: integer
        note:
          type: ["string", "null"]

    SocialOrder:
      type: object
      required: [id, userId, serviceId, serviceName, platform, link, quantity, amount, status, startCount, remainsCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        serviceId:
          type: string
        serviceName:
          type: string
        platform:
          type: string
        link:
          type: string
        quantity:
          type: integer
        amount:
          type: number
        status:
          type: string
        startCount:
          type: integer
        remainsCount:
          type: integer
        externalOrderId:
          type: ["string", "null"]
        createdAt:
